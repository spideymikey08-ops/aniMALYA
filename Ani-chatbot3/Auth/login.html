<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Aniya — Login</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page login-page" data-page="auth">
    <main class="auth-scene login-scene">
        <a class="back-home" href="../landing.html"><span aria-hidden="true">⟵</span><span>back to home</span></a>
        <section class="auth-panel login-panel" aria-labelledby="login-title">
            <h1 id="login-title">LOGIN</h1>
            <form id="loginForm">
                <label class="visually-hidden" for="username">Username</label>
                <input type="text" id="username" placeholder="Email or Username" autocomplete="username" required autofocus>
                <label class="visually-hidden" for="password">Password</label>
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">LOGIN</button>
            </form>
            <p class="auth-switch">Don’t have an account? <a href="register.html">Register here.</a></p>
        </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="../assets/js/core.js"></script>
    <script src="auth.js"></script>
</body>
</html>
